# コミット時に，ステージしたファイルを検査する．
# CIは，同じ設定のツールをリポジトリ全体に対して実行する(mise run check)．
pre-commit:
  parallel: true
  skip:
    - merge
    - rebase
  commands:
    format:
      glob:
        - '*.{ts,tsx,js,mjs,cjs,json,jsonc,css,md,mdx,yml,yaml,toml}'
        - '**/*.{ts,tsx,js,mjs,cjs,json,jsonc,css,md,mdx,yml,yaml,toml}'
      run: pnpm exec oxfmt --check --no-error-on-unmatched-pattern {staged_files}
      fail_text: 整形が必要です．`mise run fmt`を実行してください．
    code:
      glob:
        - '*.{ts,tsx,js,mjs,cjs,astro}'
        - '**/*.{ts,tsx,js,mjs,cjs,astro}'
      run: mise run sync && pnpm exec oxlint --deny-warnings {staged_files}
    markdown:
      glob: 'site/src/content/**/*.{md,mdx}'
      run: pnpm exec markdownlint-cli2 --no-globs {staged_files}
    text:
      glob: 'site/src/content/**/*.{md,mdx}'
      run: pnpm exec textlint {staged_files}
