name: サイトを公開する

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチへのpushで新しい実行が始まったら，前の実行(ビルドとデプロイ)は止める．公開されるのは
# 最新の版だけなので，古い版を最後まで作るのは無駄である．PRのチェックは，実行ごとに別のグループ
# (run_id)にして，止めることも，待たせて置き換えることもしない．
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.12
          install_args: --locked

      - run: mise run check

      # ビルドしたサイトを，ブラウザで検査する(E2Eテスト，axe，リンク切れ)．
      # 失敗すると，このjobが失敗し，deployは実行されない．
      - run: mise exec -- pnpm exec playwright install-deps chromium
      - run: mise run e2e

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
