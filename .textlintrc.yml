plugins:
  '@textlint/markdown': true
  mdx: true

filters:
  # Markdown(.md)では，HTMLコメントのtextlint-disableで，範囲を指定して検査を止められる．
  # MDXでは，このコメントが効かない．
  comments: true

rules:
  # 技術文書の文体(文の長さ，読点の数，常体の統一，弱い表現など)．
  preset-ja-technical-writing:
    # 数学の用語(狭義単調増加連続関数など)や文書名は漢字が長く続くので，15文字まで許す．
    max-kanji-continuous-len:
      max: 15
    # 本文と箇条書きを，常体(である調)にそろえる．見出しは指定しない．
    no-mix-dearu-desumasu:
      preferInHeader: ''
      preferInBody: である
      preferInList: である
      strict: false
    # 半角のカンマの数は見ない．数式の中の組(x,y,z)や集合のカンマまで数えてしまうため．
    # 読点「，」の数はmax-tenで見る．
    max-comma: false
    # 読点は「，」，句点は「．」を使う．
    max-ten:
      touten: '，'
      kuten: '．'
    ja-no-mixed-period:
      periodMark: '．'

  # 和文の中のコロンを全角にし，読点と句点を「，」と「．」にする．辞書は.textlint-prh.ymlに書く．
  prh:
    rulePaths:
      - ./.textlint-prh.yml

  # 和文と欧文の間，和文とインラインコードの間には，スペースを入れない．
  preset-ja-spacing:
    ja-space-between-half-and-full-width:
      space: never
    ja-space-around-code:
      before: false
      after: false

  # AIが書いたように見える表現(機械的な箇条書き，誇張，強調の乱用など)．
  '@textlint-ja/preset-ai-writing': true
