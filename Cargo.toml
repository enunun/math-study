[workspace]
members = ["crates/polynomial", "crates/polynomial-wasm", "crates/figure"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# 厳しく検査する．整数の演算は，あふれても停止しないよう，checked_*で書く．
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
as_conversions = "deny"

# Wasmは，小さくする．
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
