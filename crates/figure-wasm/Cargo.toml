[package]
name = "figure-wasm"
description = "figureクレートを，ブラウザから呼ぶための，Wasmの窓口．"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[lints]
workspace = true

[dependencies]
figure = { path = "../figure" }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
# CLIの版(mise.toml)と，同じ版にそろえる．食い違うと，wasm-bindgenが実行時に誤りを返す．
wasm-bindgen = "=0.2.128"
