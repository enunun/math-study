[package]
name = "figure"
description = "図のシーン(JSON)を読み，検査し，中間表現とTikZに変える．"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
puruspe = "0.4"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JSON Schemaの骨格を生成する．手書きのスキーマと型が合っているかを確かめるテストだけが使う．
schemars = { version = "1", optional = true, features = ["semver1"] }

[features]
schema = ["dep:schemars"]

[dev-dependencies]
# テストでは，schemaを有効にした自分自身を使う．
figure = { path = ".", features = ["schema"] }
