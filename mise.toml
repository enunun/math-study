[tools]
node = "24"
pnpm = "12"
gh = "2"
rtk = "0.45.0"

[settings]
lockfile = true

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "開発サーバーを起動する"
run = "pnpm --filter site dev --host"

[tasks.build]
description = "サイトをビルドする"
depends = ["install"]
run = "pnpm --filter site build"

[tasks.preview]
description = "ビルド済みのサイトを、公開時と同じ base パスで確認する"
depends = ["build"]
run = "pnpm --filter site preview --host"

[tasks.fmt]
description = "コードを整形する"
depends = ["install"]
run = "pnpm exec oxfmt"

[tasks.lint]
description = "厳格な設定でリントする"
depends = ["install"]
run = "pnpm exec oxlint --deny-warnings"

[tasks.check]
description = "整形、リント、型検査、ビルドを検査する"
depends = ["install"]
run = [
  "pnpm exec oxfmt --check",
  "pnpm exec oxlint --deny-warnings",
  "pnpm --filter site check",
  "pnpm --filter site build",
]
