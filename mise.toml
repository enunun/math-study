[tools]
node = "24"
pnpm = "12"
gh = "2"
rtk = "0.45.0"
lefthook = "2"

[settings]
lockfile = true

[tasks.install]
description = "依存パッケージをインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "開発サーバーを起動する"
run = "pnpm --filter site dev --host"

[tasks.build]
description = "サイトをビルドする"
depends = ["install"]
run = "pnpm --filter site build"

[tasks.preview]
description = "ビルド済みのサイトを，公開時と同じbaseパスで確認する"
depends = ["build"]
run = "pnpm --filter site preview --host"

[tasks.sync]
description = "Astroの型定義を生成する(型を使うリントが参照する)"
depends = ["install"]
run = "pnpm --filter site exec astro sync"

[tasks.fmt]
description = "コードと文書を整形する"
depends = ["install"]
run = "pnpm exec oxfmt"

[tasks."lint:code"]
description = "oxlintで厳格にリントする"
depends = ["sync"]
run = "pnpm exec oxlint --deny-warnings"

[tasks."lint:markdown"]
description = "markdownlintでMarkdownを検査する"
depends = ["install"]
run = "pnpm exec markdownlint-cli2"

[tasks."lint:text"]
description = "textlintで文章を検査する(文体，和欧文間のスペース，AIらしい表現)"
depends = ["install"]
run = "pnpm exec textlint site/src/content README.md"

[tasks.lint]
description = "すべてのリントを実行する"
depends = ["lint:code", "lint:markdown", "lint:text"]

[tasks.test]
description = "単体テストを実行する"
depends = ["install"]
run = "pnpm --filter site test"

[tasks.hooks]
description = "Gitのフック(コミット時の検査)を設定する"
run = "lefthook install"

[tasks.browsers]
description = "Playwrightのブラウザを，package.jsonの版に合わせて入れる(入っていれば何もしない)"
depends = ["install"]
run = "pnpm exec playwright install --only-shell chromium"

[tasks.e2e]
description = "ブラウザで動作を確認する(ビルド済みのサイトを対象にする)"
depends = ["build", "browsers"]
run = "pnpm exec playwright test"

[tasks.screenshot]
description = "ページのスクリーンショットを撮る(引数の一覧はmise run screenshotで表示する)"
depends = ["build", "browsers"]
run = "node e2e/screenshot.ts"

[tasks.setup]
description = "開発環境を整える(依存パッケージ，型定義，Playwrightのブラウザ，Gitのフック)"
depends = ["sync", "browsers", "hooks"]

[tasks.check]
description = "整形，リント，型検査，単体テスト，ビルドを検査する(CIと同じ)"
depends = ["lint"]
run = [
  "pnpm exec oxfmt --check",
  "pnpm --filter site check",
  "pnpm --filter site test",
  "pnpm --filter site build",
]
